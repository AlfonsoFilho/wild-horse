  <text x="44" y="430" fill="#8A909A" font-size="10.5">Legend: lane = one `case` arm, labeled on the switch output · `todos` (from load_list) feeds every lane as a shared input, revealed on hover · repeated `commit` drawn per lane (hover shows "same def, 4 call sites") · ◌ needs synthesis · ✓ verified</text>
