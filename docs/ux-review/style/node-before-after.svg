<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1240" height="540" viewBox="0 0 1240 540" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, sans-serif">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <filter id="e1" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- ============ BEFORE ============ -->
  <rect x="0" y="0" width="600" height="540" fill="#0A0A0A"/>
  <text x="24" y="34" fill="#A3A3A3" font-size="13" font-weight="600" letter-spacing="0.06em">BEFORE — current node style (zoom 1.0)</text>

  <!-- def validate -->
  <g transform="translate(40,70)">
    <rect width="500" height="78" rx="6" fill="#0A0A0A" stroke="#262626"/>
    <rect x="0.5" y="0.5" width="499" height="24" rx="6" fill="#3474B2" fill-opacity="0.18"/>
    <line x1="0" y1="25" x2="500" y2="25" stroke="#3474B2" stroke-opacity="0.5"/>
    <text x="8" y="17" fill="#3474B2" font-size="9">def</text>
    <text x="28" y="17" fill="#FAFAFA" font-size="12" font-weight="700">validate</text>
    <text x="88" y="17" fill="#A3A3A3" font-size="10">(form: SignupForm) -&gt; ValidForm raises Validatio</text>
    <circle cx="12" cy="40" r="3.5" fill="#262626" stroke="#4A6E99"/>
    <text x="20" y="44" fill="#FAFAFA" font-size="11" font-weight="600">form</text>
    <text x="52" y="44" fill="#A3A3A3" font-size="11">SignupForm</text>
    <text x="8" y="64" fill="#FAFAFA" font-size="11" font-weight="600">out</text>
    <text x="34" y="64" fill="#A3A3A3" font-size="11">ValidForm ! ValidationError</text>
    <text x="474" y="66" fill="#A3A3A3" font-size="9">hol</text>
    <circle cx="492" cy="62" r="3.5" fill="#4A6E99"/>
  </g>

  <!-- step validate (duplicate) -->
  <g transform="translate(40,190)">
    <rect width="300" height="64" rx="6" fill="#0A0A0A" stroke="#4CAF50" stroke-width="2"/>
    <rect x="1" y="1" width="298" height="22" rx="6" fill="#5778A3" fill-opacity="0.18"/>
    <text x="8" y="16" fill="#5778A3" font-size="9">step</text>
    <text x="34" y="16" fill="#FAFAFA" font-size="12" font-weight="700">validate</text>
    <text x="92" y="16" fill="#A3A3A3" font-size="9">step 1 of register</text>
    <circle cx="12" cy="37" r="3.5" fill="#4A6E99"/>
    <text x="20" y="41" fill="#FAFAFA" font-size="11" font-weight="600">form</text>
    <text x="52" y="41" fill="#A3A3A3" font-size="11">SignupForm</text>
    <text x="8" y="58" fill="#FAFAFA" font-size="11" font-weight="600">out</text>
    <text x="34" y="58" fill="#A3A3A3" font-size="11">ValidForm ! ValidationError</text>
    <circle cx="292" cy="54" r="3.5" fill="#4A6E99"/>
  </g>
  <path d="M340,222 C420,222 360,90 540,110" fill="none" stroke="#8C8C8C" stroke-opacity="0.35"/>

  <!-- def normalize_form failed -->
  <g transform="translate(40,300)">
    <rect width="500" height="78" rx="6" fill="#0A0A0A" stroke="#262626"/>
    <rect x="0.5" y="0.5" width="499" height="24" rx="6" fill="#3474B2" fill-opacity="0.18"/>
    <text x="8" y="17" fill="#3474B2" font-size="9">def</text>
    <text x="28" y="17" fill="#FAFAFA" font-size="12" font-weight="700">normalize_form</text>
    <text x="126" y="17" fill="#A3A3A3" font-size="10">(form: ValidForm) -&gt; ValidFor</text>
    <text x="484" y="17" fill="#FAFAFA" font-size="12">×</text>
    <circle cx="12" cy="40" r="3.5" fill="#4A6E99"/>
    <text x="20" y="44" fill="#FAFAFA" font-size="11" font-weight="600">form</text>
    <text x="52" y="44" fill="#A3A3A3" font-size="11">ValidForm</text>
    <text x="8" y="64" fill="#FAFAFA" font-size="11" font-weight="600">out</text>
    <text x="34" y="64" fill="#A3A3A3" font-size="11">ValidForm</text>
    <text x="420" y="66" fill="#A3A3A3" font-size="9">Transform · hol</text>
    <circle cx="492" cy="62" r="3.5" fill="#4A6E99"/>
  </g>

  <g font-size="11" fill="#D4D4D4">
    <text x="40" y="410">① def and step are separate nodes, joined by a faint "calls" wire</text>
    <text x="40" y="428">② every port dot is the same blue, whatever the type</text>
    <text x="40" y="446">③ failed synthesis = white "×", which reads as "close"; "hole" overlaps the port</text>
    <text x="40" y="464">④ signature truncated in the header; "!" notation is not the language's `raises`</text>
    <text x="40" y="482">⑤ green "executed" outline would collide with a green "verified" state</text>
  </g>

  <!-- ============ AFTER ============ -->
  <rect x="600" y="0" width="640" height="540" fill="#0F1012"/>
  <rect x="600" y="0" width="640" height="540" fill="url(#dots)"/>
  <text x="624" y="34" fill="#A9AEB7" font-size="13" font-weight="600" letter-spacing="0.06em">AFTER — proposed (same data)</text>

  <!-- step validate (carries callee capsule), verified = quiet -->
  <g transform="translate(640,64)">
    <rect x="0" y="2" width="300" height="112" rx="8" fill="#000" fill-opacity="0.45"/>
    <rect width="300" height="112" rx="8" fill="#1D1F23" stroke="#2A2D33"/>
    <rect x="0" y="0" width="300" height="32" rx="8" fill="#56C2E6" fill-opacity="0.10"/>
    <rect x="0" y="8" width="3" height="18" rx="1.5" fill="#56C2E6"/>
    <text x="12" y="21" fill="#56C2E6" font-size="13" font-weight="600" font-style="italic">ƒ</text>
    <text x="26" y="21" fill="#E6E8EB" font-size="13" font-weight="600">validate</text>
    <text x="90" y="21" fill="#8A909A" font-size="11">step 1</text>
    <!-- quiet success: glyph only -->
    <circle cx="282" cy="16" r="7" fill="none" stroke="#4CC38A" stroke-width="1.5"/>
    <path d="M278.5,16 l2.5,2.5 l4.5,-5" fill="none" stroke="#4CC38A" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="0" y1="32" x2="300" y2="32" stroke="#2A2D33"/>
    <!-- input port: record type, circle on the border -->
    <circle cx="0" cy="50" r="5" fill="#7DB3FF" stroke="#1D1F23" stroke-width="2"/>
    <text x="14" y="54" fill="#E6E8EB" font-size="12">form</text>
    <text x="50" y="54" fill="#A9AEB7" font-size="11.5" font-family="'JetBrains Mono', Menlo, monospace">SignupForm</text>
    <!-- output -->
    <text x="286" y="78" text-anchor="end" fill="#A9AEB7" font-size="11.5" font-family="'JetBrains Mono', Menlo, monospace">ValidForm</text>
    <circle cx="300" cy="74" r="5" fill="#7DB3FF" stroke="#1D1F23" stroke-width="2"/>
    <!-- error port on bottom edge -->
    <path d="M144,106 l6,10 l6,-10 z" fill="#F2676B"/>
    <text x="162" y="104" fill="#F2676B" font-size="10.5">raises ValidationError</text>
    <text x="14" y="100" fill="#8A909A" font-size="10.5">2 ex · 1 prop · 0.2 ms</text>
  </g>

  <!-- error rail -->
  <path d="M790,182 L790,384 L1220,384" fill="none" stroke="#F2676B" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="800" y="378" fill="#F2676B" font-size="10.5">error rail → register raises RegisterError.Invalid (from ValidationError)</text>

  <!-- data wire, colored by type, with value chip -->
  <path d="M940,138 C1010,138 840,278 910,278" fill="none" stroke="#7DB3FF" stroke-opacity="0.85" stroke-width="1.75"/>
  <g transform="translate(958,150)">
    <rect width="132" height="20" rx="10" fill="#24272C" stroke="#3A3E46"/>
    <text x="10" y="14" fill="#A9AEB7" font-size="10.5" font-family="'JetBrains Mono', Menlo, monospace">age: 30, email: "a@…</text>
  </g>

  <!-- normalize_form failing = loud -->
  <g transform="translate(910,228)">
    <rect x="0" y="2" width="310" height="128" rx="8" fill="#000" fill-opacity="0.45"/>
    <rect width="310" height="128" rx="8" fill="#1D1F23" stroke="#F2676B" stroke-opacity="0.8"/>
    <rect x="0" y="0" width="310" height="32" rx="8" fill="#56C2E6" fill-opacity="0.10"/>
    <rect x="0" y="8" width="3" height="18" rx="1.5" fill="#56C2E6"/>
    <text x="12" y="21" fill="#56C2E6" font-size="13" font-weight="600" font-style="italic">ƒ</text>
    <text x="26" y="21" fill="#E6E8EB" font-size="13" font-weight="600">normalize_form</text>
    <text x="128" y="21" fill="#8A909A" font-size="11">step 2</text>
    <g transform="translate(212,7)">
      <rect width="88" height="19" rx="9.5" fill="#F2676B" fill-opacity="0.16" stroke="#F2676B" stroke-opacity="0.6"/>
      <path d="M9,6 l7,7 M16,6 l-7,7" stroke="#F2676B" stroke-width="1.6" stroke-linecap="round"/>
      <text x="22" y="13.5" fill="#F2676B" font-size="11" font-weight="600">failing</text>
    </g>
    <line x1="0" y1="32" x2="310" y2="32" stroke="#2A2D33"/>
    <circle cx="0" cy="50" r="5" fill="#7DB3FF" stroke="#1D1F23" stroke-width="2"/>
    <text x="14" y="54" fill="#E6E8EB" font-size="12">form</text>
    <text x="50" y="54" fill="#A9AEB7" font-size="11.5" font-family="'JetBrains Mono', Menlo, monospace">ValidForm</text>
    <rect x="124" y="43" width="30" height="15" rx="4" fill="#2A2D33"/>
    <text x="139" y="54" fill="#A9AEB7" font-size="10" text-anchor="middle">own</text>
    <text x="296" y="78" text-anchor="end" fill="#A9AEB7" font-size="11.5" font-family="'JetBrains Mono', Menlo, monospace">ValidForm</text>
    <circle cx="310" cy="74" r="5" fill="#7DB3FF" stroke="#1D1F23" stroke-width="2"/>
    <line x1="10" y1="90" x2="300" y2="90" stroke="#2A2D33"/>
    <text x="14" y="108" fill="#F2676B" font-size="11">✗ property idempotent · counterexample ▸</text>
    <text x="14" y="122" fill="#8A909A" font-size="10.5">Transform · verify round 3/3 · Retry · Explain</text>
  </g>

  <g font-size="11" fill="#C9CDD4">
    <text x="640" y="418">① one node per step; it carries the callee's status, specs and timing</text>
    <text x="640" y="436">② port colour = type family, shape = structure; ports sit on the border</text>
    <text x="640" y="454">③ quiet when good (✓ outline glyph), loud when bad (red chip + border + reason)</text>
    <text x="640" y="472">④ errors leave through a red &quot;raises&quot; port onto a dashed error rail</text>
    <text x="640" y="490">⑤ last-run value as a chip on the wire; executed path uses blue, not green</text>
    <text x="640" y="508">⑥ kind = 3 px stripe + glyph + 10% header tint, never a solid fill</text>
  </g>
</svg>
