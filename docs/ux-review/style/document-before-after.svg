<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1240" height="560" viewBox="0 0 1240 560" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, sans-serif">
  <!-- BEFORE -->
  <rect width="600" height="560" fill="#0A0A0A"/>
  <text x="24" y="34" fill="#A3A3A3" font-size="13" font-weight="600" letter-spacing="0.06em">BEFORE — document block</text>
  <text x="24" y="72" fill="#FAFAFA" font-size="15">Addresses at the disposable domain <tspan fill="#FAFAFA" style="font-family:Menlo">`example.org`</tspan> are refused</text>
  <text x="24" y="96" fill="#FAFAFA" font-size="15">outright … its own <tspan font-family="Menlo">`DisposableEmail`</tspan> variant of</text>
  <text x="24" y="120" fill="#FAFAFA" font-size="15">[[ValidationError]] so callers can tell it apart.</text>
  <rect x="24" y="140" width="552" height="250" rx="6" fill="#0A0A0A" stroke="#262626"/>
  <text x="34" y="160" fill="#A3A3A3" font-size="11">wh</text>
  <line x1="24" y1="170" x2="576" y2="170" stroke="#262626"/>
  <g font-family="Menlo, monospace" font-size="13">
    <text x="34" y="194" fill="#8C8C8C">1</text><text x="56" y="194"><tspan fill="#C76BD8">def</tspan><tspan fill="#5AA0E0"> normalize_form</tspan><tspan fill="#FAFAFA">(</tspan><tspan fill="#C76BD8">own</tspan><tspan fill="#FAFAFA"> form: </tspan><tspan fill="#3FB5A0">ValidForm</tspan><tspan fill="#FAFAFA">) -&gt;</tspan></text>
    <text x="56" y="214" fill="#3FB5A0">ValidForm:</text>
    <text x="34" y="236" fill="#8C8C8C">2</text><text x="84" y="236"><tspan fill="#C76BD8">ensures</tspan><tspan fill="#FAFAFA"> result.age == form.age</tspan></text>
    <text x="34" y="258" fill="#8C8C8C">3</text><text x="84" y="258"><tspan fill="#C76BD8">pattern</tspan><tspan fill="#3FB5A0"> Transform</tspan></text>
  </g>
  <rect x="25" y="300" width="550" height="22" fill="#3A310E"/>
  <text x="34" y="315" fill="#E5C07B" font-size="11.5">line 100: `normalize_form` has no prose or docstring explaining it</text>
  <rect x="25" y="324" width="550" height="22" fill="#3A310E"/>
  <text x="34" y="339" fill="#E5C07B" font-size="11.5">line 101: `ValidForm` has no prose or docstring explaining it</text>
  <g font-size="11" fill="#D4D4D4">
    <text x="24" y="420">① backticks and [[ ]] shown literally; refs are not links</text>
    <text x="24" y="438">② block chrome = the word "wh"; no status, no actions</text>
    <text x="24" y="456">③ lint bars dominate; same yellow as real warnings</text>
    <text x="24" y="474">④ the synthesis failure is not visible in the document at all</text>
  </g>

  <!-- AFTER -->
  <rect x="600" width="640" height="560" fill="#16171A"/>
  <text x="624" y="34" fill="#A9AEB7" font-size="13" font-weight="600" letter-spacing="0.06em">AFTER — proposed</text>
  <text x="624" y="72" fill="#E6E8EB" font-size="15">Addresses at the disposable domain <tspan font-family="'JetBrains Mono', Menlo" font-size="13.5" fill="#E6E8EB">example.org</tspan> are refused</text>
  <rect x="852" y="58" width="94" height="20" rx="4" fill="#FFFFFF" fill-opacity="0.06"/>
  <text x="624" y="96" fill="#E6E8EB" font-size="15">outright … its own <tspan font-family="'JetBrains Mono', Menlo" font-size="13.5">DisposableEmail</tspan> variant of</text>
  <g transform="translate(624,106)">
    <rect width="148" height="22" rx="6" fill="#F47FA0" fill-opacity="0.12" stroke="#F47FA0" stroke-opacity="0.35"/>
    <text x="8" y="15.5" fill="#F47FA0" font-size="12" font-weight="700">!</text>
    <text x="20" y="15.5" fill="#E6E8EB" font-size="13">ValidationError</text>
    <circle cx="138" cy="11" r="3" fill="#4CC38A"/>
  </g>
  <text x="780" y="122" fill="#E6E8EB" font-size="15">so callers can tell it apart.</text>
  <!-- peek card -->
  <g transform="translate(660,132)">
    <rect x="0" y="2" width="272" height="64" rx="10" fill="#000" fill-opacity="0.5"/>
    <rect width="272" height="64" rx="10" fill="#24272C" stroke="#3A3E46"/>
    <text x="12" y="20" fill="#F47FA0" font-size="11" font-weight="600">@error enum</text><text x="88" y="20" fill="#E6E8EB" font-size="12" font-weight="600">signup.ValidationError</text>
    <text x="12" y="38" fill="#A9AEB7" font-size="11" font-family="'JetBrains Mono', Menlo">BadEmail(str) | BadAge(int) | Disposable…</text>
    <text x="12" y="55" fill="#8A909A" font-size="10.5">used by validate · 3 mentions · ⌥-click to peek</text>
  </g>
  <!-- block -->
  <g transform="translate(624,210)">
    <rect width="592" height="196" rx="8" fill="#121316" stroke="#2A2D33"/>
    <path d="M0,8 a8,8 0 0,1 8,-8 h576 a8,8 0 0,1 8,8 v24 h-592 z" fill="#1D1F23"/>
    <line x1="0" y1="32" x2="592" y2="32" stroke="#2A2D33"/>
    <text x="-14" y="20" fill="#5C626C" font-size="13">⋮⋮</text>
    <text x="12" y="21" fill="#56C2E6" font-size="13" font-weight="600" font-style="italic">ƒ</text>
    <text x="26" y="21" fill="#E6E8EB" font-size="12.5" font-weight="600">normalize_form</text>
    <g transform="translate(130,7)"><rect width="74" height="19" rx="9.5" fill="#F2676B" fill-opacity="0.16" stroke="#F2676B" stroke-opacity="0.6"/><text x="9" y="13.5" fill="#F2676B" font-size="11" font-weight="600">✗ failing</text></g>
    <text x="216" y="21" fill="#8A909A" font-size="11">1/1 ensures · Transform</text>
    <text x="440" y="21" fill="#A9AEB7" font-size="11.5">Synthesize   Run specs   ⌖ Graph</text>
    <!-- gutter -->
    <circle cx="18" cy="56" r="5" fill="none" stroke="#F2676B" stroke-width="1.5"/><path d="M15.5,53.5 l5,5 M20.5,53.5 l-5,5" stroke="#F2676B" stroke-width="1.4"/>
    <circle cx="18" cy="56" r="0" />
    <g font-family="'JetBrains Mono', Menlo, monospace" font-size="13">
      <text x="34" y="60" fill="#5C626C">1</text><text x="56" y="60"><tspan fill="#9AA7FF" font-weight="600">def</tspan><tspan fill="#56C2E6"> normalize_form</tspan><tspan fill="#A9AEB7">(</tspan><tspan fill="#9AA7FF" font-weight="600">own</tspan><tspan fill="#E6E8EB"> form: </tspan><tspan fill="#C3A6FF">ValidForm</tspan><tspan fill="#A9AEB7">) -&gt; </tspan><tspan fill="#C3A6FF">ValidForm</tspan><tspan fill="#A9AEB7">:</tspan></text>
      <text x="34" y="82" fill="#5C626C">2</text><text x="84" y="82"><tspan fill="#9AA7FF" font-weight="600">ensures</tspan><tspan fill="#E6E8EB"> result.age == form.age</tspan></text>
      <text x="470" y="82" fill="#4CC38A" font-size="11" font-family="-apple-system, Helvetica">✓ held 214×</text>
      <text x="34" y="104" fill="#5C626C">3</text><text x="84" y="104"><tspan fill="#9AA7FF" font-weight="600">pattern</tspan><tspan fill="#C3A6FF"> Transform</tspan></text>
    </g>
    <!-- agent provenance bar -->
    <rect x="4" y="68" width="2.5" height="40" rx="1" fill="#C08CFF"/>
    <!-- failure inline zone -->
    <rect x="1" y="120" width="590" height="54" fill="#F2676B" fill-opacity="0.08"/>
    <rect x="1" y="120" width="2.5" height="54" fill="#F2676B"/>
    <text x="16" y="140" fill="#F2676B" font-size="12" font-weight="600">Synthesis failed after 3 rounds — property idempotent</text>
    <text x="16" y="160" fill="#A9AEB7" font-size="11.5">counterexample  form = ValidForm(email: "Ä@b.c", age: 30)</text>
    <text x="420" y="160" fill="#6EA0FF" font-size="11.5">Retry · Explain · Open impl</text>
    <!-- prose lint as dot -->
    <circle cx="582" cy="186" r="3" fill="#8A909A"/>
    <text x="574" y="190" fill="#8A909A" font-size="11" text-anchor="end">no prose · ✦ Draft with agent</text>
  </g>
  <g font-size="11" fill="#C9CDD4">
    <text x="624" y="436">① real Markdown: code spans in mono without backticks; refs are kind-coloured chips</text>
    <text x="624" y="454">② hover a chip → peek card (signature, usages); click → select everywhere</text>
    <text x="624" y="472">③ block header = node capsule + actions; ⋮⋮ handle to move the block</text>
    <text x="624" y="490">④ gutter status per def; per-clause results inline; violet bar = unreviewed AI edit</text>
    <text x="624" y="508">⑤ failures open an inline zone with the reason and recovery actions</text>
    <text x="624" y="526">⑥ "missing prose" demoted to a grey dot with a one-click agent action</text>
  </g>
</svg>
